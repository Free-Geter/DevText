<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevText 工具箱</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      min-width: 320px;
      padding: 20px;
      color: #f1f5f9;
    }
    
    .container {
      text-align: center;
    }
    
    .logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 8px 24px rgba(6, 182, 212, 0.3);
    }
    
    .logo svg {
      width: 36px;
      height: 36px;
      color: white;
    }
    
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    p {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    
    .features {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
    }
    
    .feature {
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.2);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      color: #06b6d4;
    }
    
    .open-btn {
      width: 100%;
      padding: 12px 24px;
      background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
    }
    
    .open-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.4);
    }
    
    .open-btn:active {
      transform: translateY(0);
    }
    
    .shortcut {
      margin-top: 12px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
      </svg>
    </div>
    
    <h1>DevText 工具箱</h1>
    <p>JSON 格式化 · 错误修复 · 文本差异对比</p>
    
    <div class="features">
      <span class="feature">语法高亮</span>
      <span class="feature">错误检测</span>
      <span class="feature">自动修复</span>
      <span class="feature">转义处理</span>
      <span class="feature">文本对比</span>
    </div>
    
    <button class="open-btn" id="openTool">
      打开工具箱
    </button>
    
    <p class="shortcut">在新标签页中打开完整工具</p>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
